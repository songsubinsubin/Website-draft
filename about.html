<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Archive — About</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link href="./main.css" rel="stylesheet" />
</head>
<body>
  <nav class="nav">
    <a href="main.html" class="nav-arrow">&#x279E;</a>
    <div class="nav-links">
      <a href="main.html">Main</a>
      <a href="archive-landing.html">Interview</a>
      <a href="about.html" class="active">About</a>
      <a href="archive-landing 2(space archive).html">Space Archive</a>
    </div>
  </nav>
<div class="page-wrapper" id="page"></div>
 <script>
  const interviews = [
    {
      type:    "intro",
      title:   "About",
      venue:   "Exhibition sketchbook",
      address: "Design and intervew by Subin Song",
      people:  "",
      image:   "image/Atliernextdoormain.JPG",
      caption: "< Space In Atelier >",
      answer:  "Exhibition sketchbook is an Archive and guide of exhibition planning. I aimed to create a practical guide for those planning their first exhibition — documenting real case studies and providing a hands-on framework for the planning and installation process. I interviewed curators and gallery owners to gather genuine industry insights and feedback for students approaching exhibition-making for the first time.",
      quote: `
        <span class="gallery-label">Participating galleries</span>
        <ul class="gallery-list">
          <li><a href="https://www.ocadu.ca/galleries/onsite-gallery" target="_blank" class="gallery-link">Onsite Gallery</a> — Lisa Smith, Senior Curator</li>
          <li><a href="https://www.and1357.com/" target="_blank" class="gallery-link">Atelier Next Door</a> — Nensi and Ewan, Gallery Owners</li>
          <li><a href="https://www.gallery44.org/" target="_blank" class="gallery-link">Gallery 44</a> — Sameen Mahboubi</li>
        </ul>
      `,
    }
  ];

  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function renderIntro(data) {
    const titleLines = data.title.split('\n').map(escapeHtml).join('<br>');
    const a   = escapeHtml(data.answer);
    const cap = escapeHtml(data.caption);
    const imgClass = data.image ? "cb2-image" : "cb2-image empty";
    const img = data.image
      ? `<img src="${escapeHtml(data.image)}" alt="" />`
      : `IMAGE`;
    return `
      <div class="cb2">
        <div class="cb2-sidebar"><span class="arrow-right">&#x279E;</span></div>
        <div class="cb2-row1">
          <div class="cb2-title"><p>${titleLines}</p></div>
          <div class="cb2-info">
            <p class="cb2-info-text">
              ${escapeHtml(data.venue)}<br>
              ${escapeHtml(data.address)}<br>
              ${escapeHtml(data.people)}
            </p>
            <div class="cb2-info-arrow">&#x2193;</div>
          </div>
        </div>
        <div class="cb2-row2">
          <div>
            <div class="${imgClass}">${img}</div>
            <div class="cb2-caption">${cap}</div>
          </div>
          <div class="cb2-answer">${a}</div>
        </div>
        <div class="cb2-row3">
          <div class="cb2-quote">${data.quote}</div>
        </div>
      </div>
    `;
  }

  function renderBlock(data) {
    if (data.type === "intro") return renderIntro(data);
    const q   = escapeHtml(data.question);
    const a   = escapeHtml(data.answer);
    const cap = escapeHtml(data.caption);
    const imgFrameClass = data.image ? "image-frame" : "image-frame empty";
    const img = data.image
      ? `<img src="${escapeHtml(data.image)}" alt="${q}" />`
      : `<span class="img-placeholder">IMAGE</span>`;
    return `
      <div class="content-box">
        <div class="sidebar-arrow"><span class="arrow-right">&#x279E;</span></div>
        <div class="header-question">
          <p class="question-text">&ldquo;${q}&rdquo;</p>
        </div>
        <div class="header-empty"></div>
        <div class="main-image-col">
          <div class="${imgFrameClass}">${img}</div>
          <div class="image-caption">${cap}</div>
        </div>
        <div class="main-right-col">
          <div class="right-top">
            <div class="right-top-arrow"><span class="arrow-down">&#x2193;</span></div>
            <div class="right-top-answer">${a}</div>
          </div>
          <div class="right-bottom">
            <p class="question-text">${data.bottomRight ? escapeHtml(data.bottomRight) : '&ldquo;' + q + '&rdquo;'}</p>
          </div>
        </div>
        <div class="footer-answer">${data.answerBottom ? escapeHtml(data.answerBottom) : a}</div>
        <div class="footer-arrow"><span class="arrow-left">&#x2190;</span></div>
      </div>
    `;
  }

  document.getElementById("page").innerHTML =
    interviews.map(renderBlock).join("");
</script>
