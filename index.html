<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Archive — Main</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link href="./main.css" rel="stylesheet" />
  <style>
    .main-hero {
      position: relative;
      width: 100%;
      height: calc(100vh - 36px);
      overflow: hidden;
      background: #ccc;
    }

    /* ✏️ 배경 이미지 — src를 본인 이미지 경로로 바꾸세요 */
    .main-hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* 핑크 테두리 */
    .main-hero-frame {
      position: absolute;
      inset: 12px;
      border: 1.5px solid #FF2D9B;
      pointer-events: none;
      z-index: 2;
    }

    /* 좌상단 타이틀 */
    .main-title {
      position: absolute;
      top: 48px;
      left: 48px;
      z-index: 3;
    }
    .main-title h1 {
      font-family: 'Space Mono', monospace;
      font-size: 72px;
      font-weight: 700;
      line-height: 1.0;
      color: #FF2D9B;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      margin: 0;
    }
    .main-title p {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 400;
      color: #ffffff;
      margin-top: 16px;
      max-width: 280px;
      line-height: 1.6;
    }

    /* 화살표 버튼 공통 */
    .main-arrow-btn {
      position: absolute;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      cursor: pointer;
      text-decoration: none;
    }
    .main-arrow-btn:hover .arrow-shape polygon,
    .main-arrow-btn:hover .arrow-shape rect { fill: #FF2D9B; }
    

    .arrow-label {
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      color: #0a0a0a;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .arrow-shape polygon,
    .arrow-shape rect {
      transition: fill 0.2s;
    }

    /* 오른쪽 화살표 (INTERVIEW) — 우측 중앙 */
    .btn-interview {
      right: 80px;
      top: 50%;
      transform: translateY(-60%);
      align-items: flex-start;
    }

    /* 왼쪽 화살표 (SPACE ARCHIVE) — 좌측 하단 */
    .btn-archive {
      left: 60px;
      bottom: 80px;
      align-items: flex-start;
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav class="nav">
    <a href="main.html" class="nav-arrow">&#x279E;</a>
    <div class="nav-links">
      <a href="main.html" class="active">Main</a>
      <a href="archive-landing.html">Interview</a>
      <a href="about.html">About</a>
      <a href="archive-landing 2(space archive).html">Space Archive</a>
    </div>
  </nav>

  <!-- HERO -->
  <div class="main-hero">s

    <!-- ✏️ 배경 이미지 — src를 본인 이미지 경로로 바꾸세요 -->
    <img class="main-hero-bg" src="image/mainpageimage.png" alt="Exhibition" />

    <!-- 핑크 테두리 -->
    <div class="main-hero-frame"></div>

    <!-- 좌상단 타이틀 -->
    <div class="main-title">
      <!-- ✏️ 타이틀과 설명 텍스트 수정 -->
      <h1>Exhibition<br>Sketchbook</h1>
      <p>Exhibition sketchbook is an Archive and guide of exhibition planning.</p>
    </div>

    <!-- 오른쪽 화살표 → ARCHIVE LANDING -->
    <a href="archive-landing.html" class="main-arrow-btn btn-interview">
      <span class="arrow-label">Interview</span>
      <svg class="arrow-shape" width="380" height="200" viewBox="0 0 380 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- 화살표 몸통 -->
        <rect x="0" y="72" width="300" height="56" fill="#0a0a0a"/>
        <!-- 화살표 머리 -->
        <polygon points="270,0 380,100 270,200" fill="#0a0a0a"/>
      </svg>
    </a>

    <!-- 왼쪽 화살표 ← SPACE ARCHIVE -->
    <a href="archive-landing 2(space archive).html" class="main-arrow-btn btn-archive">
      <span class="arrow-label">Space Archive</span>
      <svg class="arrow-shape" width="380" height="200" viewBox="0 0 380 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- 화살표 머리 (왼쪽) -->
        <polygon points="110,0 0,100 110,200" fill="#0a0a0a"/>
        <!-- 화살표 몸통 -->
        <rect x="80" y="72" width="300" height="56" fill="#0a0a0a"/>
      </svg>
    </a>

  </div>

</body>
</html>
