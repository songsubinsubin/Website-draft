<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Archive</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet" />
  <link href="./main.css" rel="stylesheet" />
  <style>
    body { margin: 0; background: #FF2D9B; font-family: 'Space Grotesk', sans-serif; }

    .landing {
      position: relative;
      width: 100vw;
      height: calc(100vh - 36px);
      background: #FF2D9B;
      overflow: hidden;
    }

    /* 좌상단 타이틀 */
    .landing-title {
      position: absolute;
      top: 48px;
      left: 48px;
      z-index: 2;
    }
    .landing-title h1 {
      font-size: 64px;
      font-weight: 700;
      line-height: 1.0;
      color: #1a0010;
      margin: 0;
    }
    .landing-title p {
      font-size: 13px;
      font-weight: 400;
      color: #1a0010;
      margin-top: 12px;
    }

    /* ── 화살표 버튼 공통 ── */
    .arrow-btn {
      position: absolute;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      cursor: pointer;
    }

    .arrow-btn .lbl {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #1a0010;
      transition: color 0.2s;
      margin-bottom: 6px;
      text-align: center;
    }
    .arrow-btn:hover .lbl { color: #FF2D9B; }

    /* 화살표 SVG shape */
    .arrow-btn svg polygon,
    .arrow-btn svg rect {
      transition: fill 0.2s;
    }
    .arrow-btn:hover svg polygon,
    .arrow-btn:hover svg rect { fill: #FF2D9B; }

    /* hover 이미지 — 화살표 크기만큼 */
    .arrow-btn .hover-img {
      position: absolute;
      top: 24px; /* 라벨 아래 화살표 시작 지점 */
      left: 0;
      width: 100%;
      height: calc(100% - 24px);
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
      z-index: 4;
    }
    .arrow-btn:hover .hover-img { opacity: 1; }

    /* ── 위쪽 화살표 (ONSITE GALLERY) ── */
    .btn-up {
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      align-items: center;
    }
    .btn-up .lbl { margin-bottom: 0; margin-top: 8px; order: 2; }
    .btn-up svg  { order: 1; }

    /* ── 아래쪽 화살표 (ATELIER NEXT DOOR) ── */
    .btn-down {
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      align-items: center;
    }
    .btn-down .lbl { order: 1; margin-bottom: 8px; }
    .btn-down svg  { order: 2; }

    /* ── 왼쪽 화살표 (TBD) ── */
    .btn-left {
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      flex-direction: row;
      align-items: center;
      gap: 12px;
    }
    .btn-left .lbl { order: 2; margin-bottom: 0; }
    .btn-left svg  { order: 1; }

    /* ── 오른쪽 화살표 (XPACE) ── */
    .btn-right {
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      flex-direction: row-reverse;
      align-items: center;
      gap: 12px;
    }
    .btn-right .lbl { order: 2; margin-bottom: 0; }
    .btn-right svg  { order: 1; }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="main.html" class="nav-arrow">&#x279E;</a>
    <div class="nav-links">
      <a href="main.html">Main</a>
      <a href="interview.html">Interview</a>
      <a href="about.html">About</a>
      <a href="archive.html" class="active">Space Archive</a>
    </div>
  </nav>

  <div class="landing">

    <!-- 좌상단 타이틀 -->
    <div class="landing-title">
      <h1>Space<br>Archive</h1>
      <!-- ✏️ 설명 텍스트 -->
      <p>Toronto Exhibition space Archive</p>
    </div>

    <!-- ↑ 위 화살표: ONSITE GALLERY -->
    <a href="interview onste gallery.html" class="arrow-btn btn-up">
      <svg width="200" height="220" viewBox="0 0 200 220" fill="none">
        <polygon points="100,0 200,110 140,110 140,220 60,220 60,110 0,110" fill="#0a0a0a"/>
      </svg>
      <span class="lbl">Onsite Gallery</span>
      <!-- ✏️ hover 이미지 경로 -->
      <img class="hover-img" src="Image/Onsitegallerymain.jpg" alt="" />
    </a>

    <!-- ↓ 아래 화살표: ATELIER NEXT DOOR -->
    <a href="interview.html" class="arrow-btn btn-down">
      <span class="lbl">Atelier Next Door</span>
      <svg width="200" height="220" viewBox="0 0 200 220" fill="none">
        <polygon points="100,220 200,110 140,110 140,0 60,0 60,110 0,110" fill="#0a0a0a"/>
      </svg>
      <!-- ✏️ hover 이미지 경로 -->
      <img class="hover-img" src="image/Atliermain.JPG" alt="" />
    </a>

    <!-- ← 왼쪽 화살표: TBD -->
    <a href="archive.html" class="arrow-btn btn-left">
      <svg width="280" height="160" viewBox="0 0 280 160" fill="none">
        <polygon points="0,80 110,0 110,50 280,50 280,110 110,110 110,160" fill="#0a0a0a"/>
      </svg>
      <span class="lbl">TBD</span>
      <!-- ✏️ hover 이미지 경로 -->
      <img class="hover-img" src="your-image-left.jpg" alt="" />
    </a>

    <!-- → 오른쪽 화살표: XPACE -->
    <a href="archive.html" class="arrow-btn btn-right">
      <svg width="280" height="160" viewBox="0 0 280 160" fill="none">
        <polygon points="280,80 170,0 170,50 0,50 0,110 170,110 170,160" fill="#0a0a0a"/>
      </svg>
      <span class="lbl">Xpace</span>
      <!-- ✏️ hover 이미지 경로 -->
      <img class="hover-img" src="image/xpace.png" alt="" />
    </a>



    
  </div>

</body>
</html>
