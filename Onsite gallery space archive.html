<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Archive — Archive</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link href="./main.css" rel="stylesheet" />
  <style>
    .hotspot-container {
      position: relative;
      display: block;
      width: 100%;
    }
    .hotspot-container img {
      width: 100%;
      display: block;
    }
    .hotspot {
      position: absolute;
      font-family: 'Andale Mono', monospace;
      font-size: 1.4rem;
      font-weight: 700;
      color: #ff1493;
      cursor: pointer;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -50%);
    }
    .hotspot-preview {
      display: none;
      position: absolute;
      z-index: 100;
      bottom: 44px;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      background: white;
      border: 2px solid #ff1493;
      padding: 6px;
    }
    .hotspot-preview img {
      width: 100%;
      display: block;
    }
    .hotspot-preview p {
      font-family: 'Andale Mono', monospace;
      font-size: 0.7rem;
      margin: 6px 0 0;
      color: #111;
    }
    .hotspot:hover .hotspot-preview { display: block; }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: white;
      padding: 16px;
      max-width: 80vw;
      max-height: 85vh;
      position: relative;
      border: 2px solid #ff1493;
    }
    .modal-box img {
      max-width: 100%;
      max-height: 75vh;
      display: block;
    }
    .modal-box p {
      font-family: 'Andale Mono', monospace;
      font-size: 0.8rem;
      margin: 10px 0 0;
      color: #111;
    }
    .modal-close {
      position: absolute;
      top: 8px; right: 12px;
      font-family: 'Andale Mono', monospace;
      font-size: 1.2rem;
      cursor: pointer;
      color: #ff1493;
      background: none;
      border: none;
    }
  </style>
</head>
<body>

  <div class="modal-overlay" id="modal" onclick="closeModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <img id="modal-img" src="" />
      <p id="modal-text"></p>
    </div>
  </div>

  <nav class="nav">
    <a href="main.html" class="nav-arrow">&#x279E;</a>
    <div class="nav-links">
      <a href="main.html">Main</a>
      <a href="landingpage-interview.html">Interview</a>
      <a href="about.html">About</a>
      <a href="landingpage-spacearchive.html" class="active">Space Archive</a>
    </div>
  </nav>

  <!-- ✅ overflow:hidden 제거, height 제한 없앰 -->
  <div class="page-wrapper">
    <div class="content-box">

      <div class="header-question" style="grid-column:2/4; border-right:none;">
        <p class="question-text">Space Archive</p>
      </div>

      <!-- ✅ overflow:hidden 없음, padding:0만 유지 -->
      <div style="grid-column:2/4; padding:0;">
        <div class="hotspot-container">

          <img src="image4/space archive- Onsite gallery.jpg" />

          <!-- 숫자 1 -->
          <div class="hotspot" style="left:38%; top:64%;"
               onclick="openModal('image2/image 1.jpg', '설명 텍스트 1')">
            1
            <div class="hotspot-preview">
              <img src="image2/image 1.jpg" />
              <p>설명 텍스트 1</p>
            </div>
          </div>

          <!-- 숫자 2 -->
          <div class="hotspot" style="left:46%; top:28%;"
               onclick="openModal('image2/image 2-2.jpg', '설명 텍스트 2')">
            2
            <div class="hotspot-preview">
              <img src="image2/image 2-2.jpg" />
              <p>설명 텍스트 2</p>
            </div>
          </div>

          <!-- 숫자 3 -->
          <div class="hotspot" style="left:58%; top:20%;"
               onclick="openModal('image2/image 3.jpg', '설명 텍스트 3')">
            3
            <div class="hotspot-preview">
              <img src="image2/image 3.jpg" />
              <p>설명 텍스트 3</p>
            </div>
          </div>

          <!-- 숫자 4 -->
          <div class="hotspot" style="left:53%; top:55%;"
               onclick="openModal('image2/image 4.jpg', '설명 텍스트 4')">
            4
            <div class="hotspot-preview">
              <img src="image2/image 4.jpg" />
              <p>설명 텍스트 4</p>
            </div>
          </div>

          <!-- 숫자 5 -->
          <div class="hotspot" style="left:55%; top:77%;"
               onclick="openModal('image2/image 5.jpg', '설명 텍스트 5')">
            5
            <div class="hotspot-preview">
              <img src="image2/image 5.jpg" />
              <p>설명 텍스트 5</p>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script>
    function openModal(src, text) {
      document.getElementById('modal-img').src = src;
      document.getElementById('modal-text').textContent = text;
      document.getElementById('modal').classList.add('active');
    }
    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeModal();
    });
  </script>
  <script src="script.js"></script>

</body>
</html>
