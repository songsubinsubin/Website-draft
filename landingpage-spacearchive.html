<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Archive</title>
  <link href="./main.css" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #fff;
      font-family: 'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif;
    }

    .landing {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: calc(100vh - 36px);
    }

    .archive-section {
      display: flex;
      align-items: center;
      flex: 1;
      padding: 0 56px;
      position: relative;
      overflow: hidden;
      text-decoration: none;
      cursor: pointer;
    }

    .archive-section.pink  { background: #FF2D9B; }
    .archive-section.white { background: #ffffff; }
    .archive-section.reverse { flex-direction: row-reverse; }

    .section-num {
      font-family: 'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif;
      font-weight: 700;
      font-size: 88pt;
      line-height: 1;
      color: #ffffff;
      flex-shrink: 0;
      width: 120px;
    }
    .section-num.num-pink {
      color: #FF2D9B;
      text-align: right;
    }

    .section-text {
      flex: 1;
      padding: 0 40px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .section-text.text-right {
      align-items: flex-end;
      text-align: right;
    }

    .section-title {
      font-family: 'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif;
      font-weight: 700;
      font-variant: small-caps;
      font-size: 22pt;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1;
      color: #ffffff;
    }
    .archive-section.white .section-title { color: #FF2D9B; }

    .section-arrow-row {
      display: flex;
      align-items: center;
      width: 100%;
    }

    .arrow-line {
      flex: 1;
      height: 5px;
      background: #ffffff;
      position: relative;
    }
    .archive-section.white .arrow-line { background: #FF2D9B; }

    .arrow-line.left::before {
      content: '';
      position: absolute;
      left: -3px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-right: 14px solid #ffffff;
    }
    .archive-section.white .arrow-line.left::before { border-right-color: #FF2D9B; }

    .arrow-line.right::after {
      content: '';
      position: absolute;
      right: -3px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-left: 14px solid #ffffff;
    }
    .archive-section.white .arrow-line.right::after { border-left-color: #FF2D9B; }

    .section-gallery {
      font-family: 'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif;
      font-weight: 400;
      font-size: 18px;
      letter-spacing: 0.04em;
      color: #ffffff;
      white-space: nowrap;
    }
    .archive-section.white .section-gallery { color: #FF2D9B; }

    .hover-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 1;
    }
    .archive-section:hover .hover-overlay { opacity: 0.18; }

    .section-num,
    .section-text {
      position: relative;
      z-index: 2;
    }

    .section-divider {
      width: 100%;
      height: 1px;
      background: rgba(0, 0, 0, 0.12);
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="main.html" class="nav-arrow">&#x279E;</a>
    <div class="nav-links">
      <a href="main.html">Main</a>
      <a href="archive-landing.html">Interview</a>
      <a href="about.html">About</a>
      <a href="archive-landing 2(space archive).html" class="active">Space Archive</a>
    </div>
  </nav>

  <div class="landing">

    <!-- 1: pink, left arrow ← -->
    <a href="Onsite gallery space archive.html" class="archive-section pink">
      <img class="hover-overlay" src="Image/Onsitegallerymain.jpg" alt="" />
      <div class="section-num">1</div>
      <div class="section-text">
        <div class="section-title">Mocking Up Experience</div>
        <div class="section-arrow-row">
          <div class="arrow-line left"></div>
        </div>
        <div class="section-gallery">Onsite Gallery</div>
      </div>
    </a>

    <div class="section-divider"></div>

    <!-- 2: white, right arrow → -->
    <a href="Atlier next door space archive.html" class="archive-section white reverse">
      <div class="section-num num-pink">2</div>
      <div class="section-text text-right">
        <div class="section-title">Commercial Contemporary Gallery</div>
        <div class="section-arrow-row">
          <div class="arrow-line right"></div>
        </div>
        <div class="section-gallery">Atlier Next Door</div>
      </div>
    </a>

    <div class="section-divider"></div>

    <!-- 3: pink, left arrow ← -->
    <a href="interview-G44.html" class="archive-section pink">
      <img class="hover-overlay" src="Image/gallery44main.jpg" alt="" />
      <div class="section-num">3</div>
      <div class="section-text">
        <div class="section-title">Contemporary Photography</div>
        <div class="section-arrow-row">
          <div class="arrow-line left"></div>
        </div>
        <div class="section-gallery">Gallery 44</div>
      </div>
    </a>

  </div>

</body>
</html>
